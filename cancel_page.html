<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата отменена</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        .icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ef4444;
            margin: 0 auto 30px;
            animation: scaleIn 0.5s ease-out;
        }

        .icon svg {
            width: 50px;
            height: 50px;
            stroke: white;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #1f2937;
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .message {
            color: #6b7280;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .info-box {
            background: #fef2f2;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            border: 1px solid #fecaca;
        }

        .info-box p {
            color: #991b1b;
            font-size: 15px;
            line-height: 1.6;
        }

        .emoji {
            font-size: 24px;
            margin-right: 8px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 52 52">
                <line x1="16" y1="16" x2="36" y2="36"/>
                <line x1="36" y1="16" x2="16" y2="36"/>
            </svg>
        </div>

        <h1>Оплата отменена</h1>

        <p class="message">
            Платёж не был завершён.<br>
            Средства не были списаны с вашей карты.
        </p>

        <div class="info-box">
            <p>
                <span class="emoji">ℹ️</span>
                Вы можете вернуться к киоску и попробовать снова,<br>
                или выбрать другой способ оплаты.
            </p>
        </div>

        <div class="info-box" style="margin-top: 15px; background: #f3f4f6; border-color: #d1d5db;">
            <p style="color: #4b5563;">
                <span class="emoji">💡</span>
                Вы можете закрыть эту страницу.
            </p>
        </div>
    </div>
</body>
</html>
